[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-forge"
version = "0.1.0"
description = "A personal quantitative trading research and backtesting framework"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = ["matplotlib>=3.7", "plotly>=5.18"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "mypy>=1.8,<1.15"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*"]
exclude = ["tests*", "examples*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["quant"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["quant", "examples", "tests"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["matplotlib.*", "plotly.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pytest", "_pytest.*"]
# 不解析当前环境较新 pytest 的内部运行库。
follow_imports = "skip"
