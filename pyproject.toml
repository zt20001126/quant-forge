[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-forge"
version = "0.1.0"
description = "A personal quantitative trading research and backtesting framework"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["quant*"]
exclude = ["tests*", "examples*"]
