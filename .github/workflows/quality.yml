name: Quality

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest

    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -ra
      - run: python -m ruff check .
      - run: python -m mypy